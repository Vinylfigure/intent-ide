name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose. That filter matches the pull
  # request's BASE branch, so a PR stacked on another PR's branch was skipped
  # entirely — intent-ide#46 reached a merge with no `verify` run ever having
  # happened, and once `verify` became a required check a never-reported check
  # blocked the merge permanently. GitHub also fires no run when it retargets
  # a stacked PR's base after the parent merges, so the gap did not self-heal.
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Exercise the actual migration SQL against a fresh database — a broken
      # migration fails CI here, not on the next dev machine.
      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # End-to-end, in its own job so a browser download never slows the fast
  # feedback above. Added because the suite had been silently rotting: two
  # assertions in cascade-review.spec.ts referenced UI wording that had been
  # changed away months earlier, and nothing reported it because e2e ran
  # nowhere. The LIVE_LOCAL suite (tests/local-model.spec.ts) self-skips
  # without an Ollama, so this job stays deterministic.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
